<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Φ Gaming</title>
  <link rel="stylesheet" href="../jeopardy/style.css">
  <link rel="icon" href="../favicon.png" type="image/png">
</head>
<body>
  <nav id="top-nav">
    <a id="home-link" href="../index.html">Gaming Philosophy Class</a>
  </nav>
  <header id="page-header" data-default-course="introPhilosophy">Course • Activity</header>
  <div class="container">
    <h1>Trivia Game</h1>
    <div>
      <label for="category-select">Topic:</label>
      <select id="category-select" disabled>
        <option value="all">All</option>
      </select>
    </div>

    <div id="trivia-score" class="hidden" hidden>Score: <span id="trivia-correct">0</span>/<span id="trivia-total">0</span></div>
    <div class="course-progress"><div id="trivia-progress" class="course-progress-bar"></div></div>

    <div id="trivia-game" class="hidden" hidden tabindex="0">
      <p id="trivia-question"></p>
      <div id="trivia-options" class="mc-options"></div>
      <div id="trivia-feedback" class="hidden" hidden></div>
      <button id="trivia-next" class="hidden" hidden>Next Question</button>
    </div>
    <div id="trivia-share" class="hidden" hidden>
      <button id="trivia-copy">Copy Link</button>
      <button id="trivia-web-share">Share</button>
    </div>
  </div>

  <script src="../jeopardy/data/ethics.js"></script>
  <script src="../jeopardy/data/ethics-final.js"></script>
  <script src="../jeopardy/data/critical-thinking.js"></script>
  <script src="../jeopardy/data/critical-thinking-midterm.js"></script>
  <script src="../jeopardy/data/critical-thinking-final.js"></script>
  <script src="../jeopardy/data/intro-philosophy.js"></script>
  <script src="../jeopardy/data/intro-philosophy-final.js"></script>
  <script src="../utils.js"></script>
  <script src="trivia.js"></script>
  <script src="../next-activity.js"></script>
  <script src="../page-header.js"></script>
</body>
</html>
