<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Critical Thinking Jeopardy — Prof. Parks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0a06;
    --paper: #f5efe0;
    --paper-warm: #ede4cf;
    --accent: #8b2e1e;
    --accent-soft: #b8664f;
    --gold: #a88b3f;
    --rule: #2a2620;
    --shadow: rgba(13, 10, 6, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at top left, rgba(168, 139, 63, 0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(139, 46, 30, 0.06), transparent 50%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05 0 0 0 0 0.04 0 0 0 0 0.02 0 0 0 0.15 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    pointer-events: none;
    opacity: 0.35;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 1400px;
    margin: 0 auto;
    padding: 3rem 2rem 4rem;
  }

  header {
    text-align: center;
    margin-bottom: 3rem;
    position: relative;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  h1 .amp {
    font-weight: 400;
    color: var(--accent);
    font-style: italic;
  }

  .subtitle {
    margin-top: 1rem;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--rule);
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
  }

  .rule {
    margin: 2rem auto;
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rule), transparent);
    position: relative;
  }

  .rule::before {
    content: "§";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--paper);
    padding: 0 1rem;
    color: var(--accent);
    font-size: 1.2rem;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 2rem;
  }

  .cat {
    background: var(--ink);
    color: var(--paper);
    padding: 1.5rem 0.75rem;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1.2;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    border: 2px solid var(--ink);
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 3px 3px 0 var(--gold);
  }

  .cell {
    background: var(--paper-warm);
    border: 2px solid var(--ink);
    aspect-ratio: 1 / 0.75;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(1.3rem, 2.5vw, 2.2rem);
    color: var(--accent);
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease;
    position: relative;
    box-shadow: 3px 3px 0 var(--shadow);
  }

  .cell::before {
    content: "$";
    font-size: 0.65em;
    vertical-align: super;
    margin-right: 0.05em;
    color: var(--gold);
  }

  .cell:hover:not(.done) {
    background: var(--ink);
    color: var(--paper);
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--shadow);
  }

  .cell:hover:not(.done)::before { color: var(--gold); }

  .cell.done {
    background: transparent;
    color: transparent;
    cursor: default;
    box-shadow: none;
    border-style: dashed;
    border-color: rgba(42, 38, 32, 0.3);
  }

  .cell.done::before { content: ""; }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(13, 10, 6, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
    padding: 2rem;
  }

  .modal-bg.open { display: flex; }

  .modal {
    background: var(--paper);
    border: 2px solid var(--ink);
    max-width: 780px;
    width: 100%;
    padding: 3rem;
    position: relative;
    box-shadow: 12px 12px 0 var(--accent);
    animation: pop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1.2);
  }

  @keyframes pop {
    from { transform: scale(0.85) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }

  .modal-value {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    color: var(--gold);
    font-size: 1.1rem;
    margin-bottom: 1.5rem;
  }

  .modal-q {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.3rem, 2.5vw, 1.75rem);
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: 2rem;
    font-weight: 600;
  }

  .modal-a {
    padding: 1.75rem;
    background: var(--paper-warm);
    border-left: 4px solid var(--accent);
    font-size: 1.1rem;
    line-height: 1.65;
    color: var(--rule);
    display: none;
  }

  .modal-a.show { display: block; }

  .modal-a em {
    font-style: italic;
    color: var(--ink);
  }

  .modal-a strong {
    color: var(--ink);
    font-weight: 700;
  }

  .modal-a .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 0.5rem;
  }

  .modal-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.85rem 1.5rem;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button:hover {
    background: var(--ink);
    color: var(--paper);
  }

  button.primary {
    background: var(--accent);
    color: var(--paper);
    border-color: var(--accent);
  }

  button.primary:hover {
    background: var(--ink);
    border-color: var(--ink);
  }

  .close-x {
    position: absolute;
    top: 1rem;
    right: 1rem;
    font-size: 1.5rem;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  footer {
    text-align: center;
    margin-top: 3rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--rule);
    opacity: 0.6;
  }

  .reset-btn {
    display: block;
    margin: 1.5rem auto 0;
  }

  @media (max-width: 768px) {
    .wrap { padding: 1.5rem 1rem 3rem; }
    .board { gap: 5px; }
    .cat { font-size: 0.65rem; padding: 0.75rem 0.25rem; min-height: 70px; box-shadow: 2px 2px 0 var(--gold); }
    .cell { font-size: 1rem; box-shadow: 2px 2px 0 var(--shadow); }
    .modal { padding: 2rem 1.5rem; box-shadow: 6px 6px 0 var(--accent); }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="eyebrow">Philosophy · Critical Thinking</div>
    <h1>Reason <span class="amp">&amp;</span><br>Consequence</h1>
    <p class="subtitle">A game of prompts and reasoning — think through the question, then reveal one way to work it out.</p>
    <div class="rule"></div>
  </header>

  <div class="board" id="board"></div>

  <button class="reset-btn" onclick="resetBoard()">↺ Reset Board</button>

  <footer>Prof. Parks · Critical Thinking</footer>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">×</button>
    <div class="modal-cat" id="m-cat"></div>
    <div class="modal-value" id="m-val"></div>
    <div class="modal-q" id="m-q"></div>
    <div class="modal-a" id="m-a">
      <span class="label">One way to think about it</span>
      <div id="m-a-text"></div>
    </div>
    <div class="modal-actions">
      <button onclick="showAnswer()" id="reveal-btn" class="primary">Reveal Answer</button>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  const categories = [
    {
      name: "Arguments & Reasoning",
      questions: [
        { v: 100, q: "If someone's argument is logically airtight — meaning the conclusion really does follow from the premises — does that mean their conclusion is true? Why or why not?", a: "Not necessarily. An argument can be <strong>valid</strong> (the conclusion follows logically from the premises) while still having false premises. A true conclusion requires both valid form AND true premises — what philosophers call a <strong>sound</strong> argument." },
        { v: 200, q: "What's the difference between an argument that tries to guarantee its conclusion and one that only tries to make it probable?", a: "The first is <strong>deductive</strong> — if the premises are true, the conclusion MUST be true. The second is <strong>inductive</strong> — the premises give us reasons to think the conclusion is likely, but don't guarantee it. Scientific generalizations, predictions, and arguments from experience are usually inductive." },
        { v: 300, q: "Why might a strong inductive argument still lead to a false conclusion?", a: "Because induction is about probability, not certainty. Even if the premises strongly support the conclusion, something unexpected could make it wrong. \"Every swan I've seen has been white, so all swans are white\" was a strong argument — until black swans were discovered. Strong inductive reasoning tells you what's <em>likely</em>, not what's guaranteed." },
        { v: 400, q: "Someone says: \"All politicians lie. Senator Smith is a politician. So Senator Smith lies.\" Walk through whether this argument is valid, and whether it's sound.", a: "It's <strong>valid</strong> — if both premises were true, the conclusion would have to follow. But it's probably not <strong>sound</strong>, because the first premise (\"all politicians lie\") is a sweeping generalization that isn't actually supported. A good critical thinker distinguishes \"the logic works\" from \"the premises are true.\"" },
        { v: 500, q: "Why does it matter whether we're clear on the difference between an argument's FORM and its CONTENT?", a: "Because bad reasoning can come from either place. A form can be broken (the conclusion doesn't actually follow) even if the premises are true, OR the form can work fine but the premises are false or unsupported. Mixing these up leads people to either dismiss good arguments or accept bad ones. Evaluating arguments means checking both separately." }
      ]
    },
    {
      name: "Fallacies & Propaganda",
      questions: [
        { v: 100, q: "Your friend says, \"You can't trust anything Professor Jones says about climate policy — he drives a big SUV.\" What's wrong with this response?", a: "It attacks the person instead of engaging with the argument. Even if Professor Jones is a hypocrite, that has nothing to do with whether his argument is right or wrong. This is sometimes called an <strong>ad hominem</strong> move — it changes the subject from the claim to the claimant." },
        { v: 200, q: "Before arguing against a position, what should a careful thinker do first — and why does it matter?", a: "They should make sure they've stated the other side's view <strong>accurately and charitably</strong>. If you argue against a weaker or distorted version of someone's view, you haven't actually refuted their real position. This is the problem with \"straw man\" reasoning: you knock down a fake version and think you've won." },
        { v: 300, q: "\"If we let students use calculators, soon they won't know any math at all, and eventually nobody will be able to do basic arithmetic.\" What's missing from this reasoning?", a: "The argument assumes each step leads to the next without giving reasons. Every link in the chain (calculator use → no math knowledge → total arithmetic collapse) needs actual evidence. Without it, this is just a worst-case prediction dressed up as an argument — the kind of move often called a <strong>slippery slope</strong>." },
        { v: 400, q: "What's the difference between persuading someone and manipulating them?", a: "Persuasion gives people reasons and lets them evaluate those reasons freely. Manipulation works around someone's rational judgment — through fear, flattery, emotional pressure, or misleading framing — to get them to a conclusion without really weighing it. Propaganda typically relies on manipulation, which is why it's considered harmful even when its conclusions happen to be true." },
        { v: 500, q: "Why is \"everyone agrees with this\" a bad reason to believe something — even when it's true that everyone does?", a: "Because popularity isn't evidence of truth. Whole societies have agreed on things that turned out to be wrong (that the sun orbited the earth, that certain groups of people didn't deserve rights). The fact that many people believe something might be a reason to take it seriously, but it isn't itself a reason to think it's correct. You still have to look at the actual evidence." }
      ]
    },
    {
      name: "Bodies & Consent",
      questions: [
        { v: 100, q: "Why do most people think it would be wrong to take someone's kidney without their permission, even if doing so would save another person's life?", a: "Because we generally believe people have the right to decide what happens to their own bodies. Even a very good outcome (saving a life) doesn't override that right without consent. This intuition — that your body isn't just a resource others can use for good purposes — sits at the heart of a lot of ethical reasoning about medicine, sex, and reproductive choice." },
        { v: 200, q: "What has to be true for someone's \"yes\" to really count as consent?", a: "At minimum: the person needs to actually understand what they're agreeing to, they need to be choosing freely (not pressured, coerced, or manipulated), and they need to be in a state where they're capable of making the decision (not drunk, unconscious, too young, etc.). A \"yes\" that's uninformed, pressured, or given by someone who can't really choose isn't meaningful consent." },
        { v: 300, q: "Someone argues: \"If a fetus is a person, then abortion is murder.\" Even if we grant the first part, why might the second part still not follow?", a: "Because \"being a person\" doesn't automatically mean \"no one can stop sustaining you with their body.\" We don't generally force people to donate blood, organs, or bone marrow to save others — even when those others are unquestionably persons. So even granting personhood, there's still a separate question about whether someone can be <em>required</em> to use their body to keep another being alive." },
        { v: 400, q: "\"Abortion is wrong because killing is wrong.\" What's too quick about this argument?", a: "The premise \"killing is wrong\" is too broad. Most people accept that killing is permissible in at least some cases — self-defense, for instance, or in some views war or capital punishment. So the premise as stated would condemn things the speaker probably doesn't want to condemn. A better argument would specify what <em>kind</em> of killing is wrong and why." },
        { v: 500, q: "Why do philosophers distinguish between being \"human\" and being a \"person\"? Isn't that the same thing?", a: "Not exactly. \"Human\" is a biological term — it refers to members of the species Homo sapiens, including things like cells, tissues, and embryos. \"Person\" is a moral term — it refers to beings with certain capacities (awareness, interests, relationships) that we think give them moral status. Keeping the two separate lets us ask a real question: does biological humanity <em>automatically</em> confer moral personhood, or are there other considerations? Different answers lead to very different ethical conclusions." }
      ]
    },
    {
      name: "Power & the State",
      questions: [
        { v: 100, q: "A country gained formal independence 50 years ago, but its economy is still largely controlled by its former colonizer. What does this suggest about what it means to \"end\" colonialism?", a: "That formal political independence isn't the whole story. Colonial power can continue through economic control, cultural influence, and institutional structures long after flags change. If we only measure freedom by official political status, we'll miss ongoing forms of domination that operate through different channels." },
        { v: 200, q: "When a powerful country describes another as \"backward\" or \"in need of civilizing,\" what work is that description doing — beyond just being rude?", a: "It's setting up a justification for control. If the other country is portrayed as unable to govern itself, then intervention, occupation, or resource extraction can be framed as help rather than harm. The language doesn't just describe — it constructs the target as something that invites control, which makes the control seem natural or benevolent rather than aggressive." },
        { v: 300, q: "If a group is told across generations that they're inferior, some members may come to believe it. What does this show about how oppression works?", a: "That it isn't only about laws, violence, or economics — it also shapes how people see themselves. If oppressed groups internalize negative messages, the effects of oppression continue even after external restrictions are lifted. This is why critical thinkers point out that equality isn't just about changing rules; it's about changing the ideas and images that people absorb about themselves and each other." },
        { v: 400, q: "\"It's legal, so it's right.\" What's wrong with this way of thinking?", a: "It confuses two different questions. <strong>Legality</strong> is about what the law says; <strong>morality</strong> is about what's actually ethical. History gives us plenty of examples where the two came apart — slavery was legal, segregation was legal, denying women the vote was legal. If \"legal = right,\" we'd have no grounds to criticize unjust laws or work to change them. The two categories need to stay separate." },
        { v: 500, q: "Someone defends police brutality by saying, \"It produces better outcomes overall — less crime, safer streets.\" Even if that were true, what's a serious problem with the argument?", a: "It treats individual people as tools for producing aggregate benefits. If \"better outcomes overall\" can justify violating someone's rights, then in principle almost anything done to an individual can be justified as long as enough others benefit. Most of us don't actually accept this — we think people have rights that can't simply be overridden by majority benefit. The outcomes-only argument ignores that constraint." }
      ]
    },
    {
      name: "Contemporary Issues",
      questions: [
        { v: 100, q: "Someone argues for more open immigration by pointing out that nobody chooses where they're born. What moral idea is that appeal drawing on?", a: "The idea that it's unfair to give people major advantages or disadvantages based on things they had no control over. Where you're born is a matter of luck — you didn't earn it, you didn't choose it. If we wouldn't accept giving someone a worse life because of their eye color or height (things they also didn't choose), the argument goes, we should be suspicious of doing so based on birthplace." },
        { v: 200, q: "A common argument FOR stricter immigration policy compares a country to a household: \"We get to decide who comes into our home.\" Where might this analogy break down?", a: "A home is owned by a small, unified group who all agreed to live together; a country is made up of millions of people with different views, who didn't all sign the same agreement. Also, nobody is born needing a specific house to survive, but people are born into countries and have deep connections to them. The analogy pushes us toward one answer by making a country sound simpler and more private than it actually is." },
        { v: 300, q: "When police misconduct keeps happening across many different departments and cities, why is \"it's just a few bad apples\" an inadequate response?", a: "Because if the same problem shows up across many different places, the cause probably isn't just a few bad individuals — it's something about the structure: how officers are trained, what conduct gets rewarded or punished, what oversight exists, what cultural norms take hold. Focusing only on individual wrongdoers lets the underlying system off the hook, which is why the problem tends to persist." },
        { v: 400, q: "What's a reasonable principle for judging whether a use of force by police was justified, even when some force was clearly needed?", a: "That the force should be <strong>no greater than what the situation required</strong>. If someone can be safely controlled without serious injury, using deadly force is excessive. This kind of \"fit between means and ends\" shows up across ethics — in self-defense, in military ethics, in discipline — and gives us a way to say \"yes, some force was warranted, but not <em>that much</em>.\"" },
        { v: 500, q: "A person might face unfair treatment not because of their race alone, and not because of their gender alone, but because of the specific combination. What does this tell us about analyzing discrimination?", a: "That you can miss real patterns if you only look at one category at a time. A Black woman's experience of discrimination isn't always just \"what Black men face\" plus \"what white women face\" — sometimes it's specific to the overlap. If our analysis only examines single categories, we'll overlook forms of unfairness that only show up where categories meet." }
      ]
    },
    {
      name: "Spot the Reasoning",
      questions: [
        { v: 100, q: "\"You can't trust her argument against the new policy — she's been complaining about everything all semester.\" What's wrong with this response, and what should the speaker do instead?", a: "The response attacks the person rather than engaging with her actual argument. Whether or not she complains often has no bearing on whether <em>this particular</em> argument is any good. A better response would address the argument itself: what are her reasons, and are those reasons any good?" },
        { v: 200, q: "\"If we allow any restrictions on speech, soon the government will ban all political criticism.\" What would you ask the person making this argument?", a: "You'd ask them to show the actual chain of reasoning — why does \"any restriction\" lead to \"banning all criticism\"? What are the specific mechanisms that would make each step happen? Without those, the argument is just a worst-case prediction without support. Some restrictions on speech (fraud, threats, defamation) have existed for a long time without producing that outcome." },
        { v: 300, q: "Consider: \"All officers are public servants. All public servants deserve trust. Therefore, all officers deserve trust.\" Does the conclusion follow from the premises? And is it actually a good argument?", a: "The conclusion <strong>does follow</strong> from the premises — if both premises were true, the conclusion would have to be true. But the second premise (\"all public servants deserve trust\") is very questionable. So the argument is logically well-formed but probably not sound. This is a good example of why \"the logic works\" isn't the same as \"the argument is good.\"" },
        { v: 400, q: "\"I surveyed 30 students in my philosophy class, and 90% supported the new policy. So most people in the country support it.\" What's the problem?", a: "A philosophy class at one school isn't a representative sample of the country. Students in that class likely share age range, education level, geographic location, and probably some political leanings. Drawing conclusions about \"most people in the country\" from such a narrow, non-random sample is a classic overreach — the sample just can't support the claim being made." },
        { v: 500, q: "A politician says: \"My opponent wants open borders and the abolition of all immigration law.\" The opponent actually supports reforming legal immigration pathways. What's happening, and why does it matter?", a: "The politician is arguing against a distorted version of the opponent's position rather than what the opponent actually said. This is a \"straw man\" move. It matters because even if the politician successfully refutes the distorted version, they haven't actually addressed the real argument. Audiences may walk away thinking the opponent has been refuted when the actual view hasn't even been engaged with." }
      ]
    }
  ];

  const board = document.getElementById("board");

  function renderBoard() {
    board.innerHTML = "";
    categories.forEach((cat, ci) => {
      const header = document.createElement("div");
      header.className = "cat";
      header.textContent = cat.name;
      header.style.gridColumn = (ci + 1);
      header.style.gridRow = 1;
      board.appendChild(header);
    });
    categories.forEach((cat, ci) => {
      cat.questions.forEach((q, qi) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = q.v;
        cell.dataset.ci = ci;
        cell.dataset.qi = qi;
        cell.style.gridColumn = (ci + 1);
        cell.style.gridRow = (qi + 2);
        if (localStorage.getItem(`done-${ci}-${qi}`) === "1") {
          cell.classList.add("done");
        }
        cell.onclick = () => openCell(ci, qi, cell);
        board.appendChild(cell);
      });
    });
  }

  let currentCell = null;

  function openCell(ci, qi, cellEl) {
    if (cellEl.classList.contains("done")) return;
    currentCell = cellEl;
    const cat = categories[ci];
    const item = cat.questions[qi];
    document.getElementById("m-cat").textContent = cat.name;
    document.getElementById("m-val").textContent = `$${item.v}`;
    document.getElementById("m-q").textContent = item.q;
    document.getElementById("m-a-text").innerHTML = item.a;
    document.getElementById("m-a").classList.remove("show");
    document.getElementById("reveal-btn").style.display = "inline-block";
    document.getElementById("modal").classList.add("open");
    cellEl.dataset.ci = ci;
    cellEl.dataset.qi = qi;
  }

  function showAnswer() {
    document.getElementById("m-a").classList.add("show");
    document.getElementById("reveal-btn").style.display = "none";
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("open");
    if (currentCell) {
      currentCell.classList.add("done");
      localStorage.setItem(`done-${currentCell.dataset.ci}-${currentCell.dataset.qi}`, "1");
    }
  }

  function resetBoard() {
    if (!confirm("Reset the entire board?")) return;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("done-")) localStorage.removeItem(k);
    }
    // run again because removing shifts indices
    Object.keys(localStorage).filter(k => k.startsWith("done-")).forEach(k => localStorage.removeItem(k));
    renderBoard();
  }

  document.getElementById("modal").addEventListener("click", (e) => {
    if (e.target.id === "modal") closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
    if (e.key === " " && document.getElementById("modal").classList.contains("open")) {
      e.preventDefault();
      showAnswer();
    }
  });

  renderBoard();
</script>

</body>
</html>
