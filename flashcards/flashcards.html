<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Φ MindGames</title>
  <link rel="stylesheet" href="../jeopardy/style.css">
  <link rel="icon" href="../favicon.png" type="image/png">
</head>
<body>
  <nav id="top-nav">
    <a id="home-link" href="../index.html">Philosophy <span class="mind">Mind</span>Games</a>
  </nav>
  <header id="page-header">Course • Activity</header>
  <div class="container">
    <h1>Flashcards</h1>
    <div>
      <label for="course-select">Course:</label>
      <select id="course-select">
        <option value="">--Select--</option>
        <option value="introPhilosophy">Intro to Philosophy</option>
        <option value="criticalThinking">Critical Thinking</option>
        <option value="ethics">Ethics</option>
      </select>
      <label for="category-select">Category:</label>
      <select id="category-select" disabled>
        <option value="all">All</option>
      </select>
    </div>

    <div id="flashcard" class="hidden" hidden tabindex="0">
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <p id="flashcard-question"></p>
          </div>
          <div class="flip-card-back">
            <p id="flashcard-answer" class="hidden" hidden></p>
          </div>
        </div>
      </div>
      <button id="exit-cards" class="flashcard-close" type="button">X</button>
      <div class="flashcard-controls">
        <button id="prev-card">Prev Card</button>
        <button id="next-card">Next Card</button>
      </div>
    </div>
  </div>

  <script src="../jeopardy/data/intro-philosophy-flashcards.js"></script>
  <script src="../jeopardy/data/critical-thinking-flashcards.js"></script>
  <script src="../jeopardy/data/ethics-flashcards.js"></script>
  <script src="flashcards.js"></script>
  <script src="../page-header.js"></script>
</body>
</html>
