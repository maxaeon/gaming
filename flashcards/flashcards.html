<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Φ Gaming</title>
  <link rel="stylesheet" href="../jeopardy/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../favicon.png" type="image/png">
</head>
<body class="flashcard-page">
  <nav id="top-nav">
    <a id="home-link" href="../index.html">Gaming Philosophy Class</a>
  </nav>
  <header id="page-header" data-default-course="introPhilosophy">Course • Activity</header>
  <div class="container">
    <h1>Flashcards</h1>
    <div>
      <label for="category-select">Topic:</label>
      <select id="category-select" disabled>
        <option value="all">All</option>
      </select>
    </div>

    <div id="flashcard" class="hidden" hidden tabindex="0">
      <button class="flashcard-close" type="button">X</button>
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <div class="flashcard-content">
              <p id="flashcard-question"></p>
            </div>
          </div>
          <div class="flip-card-back">
            <div class="flashcard-content">
              <p id="flashcard-answer" class="hidden" hidden></p>
            </div>
          </div>
        </div>
      </div>
      <div class="flashcard-controls">
        <button class="prev-card" type="button">Prev</button>
        <button class="flip-card-btn" type="button">Flip</button>
        <button class="next-card" type="button">Next</button>
      </div>
    </div>
  </div>

  <script src="../jeopardy/data/intro-philosophy-flashcards.js"></script>
  <script src="../jeopardy/data/critical-thinking-flashcards.js"></script>
  <script src="../jeopardy/data/ethics-flashcards.js"></script>
  <script src="../utils.js"></script>
  <script src="flashcards.js"></script>
  <script src="../page-header.js"></script>
</body>
</html>
