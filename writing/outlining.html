<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Φ Gaming</title>
  <link rel="stylesheet" href="../jeopardy/style.css">
  <link rel="icon" href="../favicon.png" type="image/png">
  <style>
    #puzzle-pieces li {
      display: inline-block;
      background: #ce93d8;
      color: #000;
      padding: 6px 8px;
      margin: 4px;
      border-radius: 6px;
      cursor: grab;
    }
    #outline-slots li {
      border: 2px dashed #7b1fa2;
      padding: 10px;
      margin: 8px 0;
      min-height: 40px;
      border-radius: 8px;
      list-style: none;
    }
    #outline-slots textarea {
      width: 90%;
      margin-top: 4px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #7b1fa2;
      border-radius: 4px;
    }
    #congrats {
      font-size: 24px;
      margin-top: 10px;
      color: #ffd54f;
    }
    .remove-btn {
      margin-left: 6px;
      background: #7b1fa2;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .citation {
      text-decoration: underline dotted;
      cursor: help;
    }
  </style>
</head>
<body>
  <nav id="top-nav">
    <a id="home-link" href="../index.html">Gaming Philosophy Class</a>
  </nav>
  <header id="page-header">Course • Activity</header>
  <div class="container">
    <h1>Outline Builder</h1>
    <p class="instructions">Drag each piece into any order you wish. Use the blank lines to add your own explanation and support for each claim.</p>
    <ul id="puzzle-pieces"></ul>
    <button id="add-piece">Add Block</button>
    <ol id="outline-slots"></ol>
    <button id="example-btn">Show Example Outline</button>
    <div id="hint-text" class="hidden" hidden></div>
    <div id="congrats" class="hidden" hidden></div>
    <p id="summary" class="hidden" hidden><strong>Remember:</strong> Clear outlines guide readers step by step through your argument.</p>
    <button id="draft-btn">Open Draft Worksheet</button>
    <div id="draft-area" class="project-area hidden" hidden>
      <h2>Draft Worksheet</h2>
      <label>Thesis Statement:</label><br>
      <textarea id="draft-thesis" rows="2" style="width:90%;" placeholder="Write your thesis here..."></textarea>
      <div id="draft-body">
        <div class="body-section">
          <label>Topic Sentence:</label><br>
          <textarea class="topic-input" rows="2" style="width:90%;"></textarea><br>
          <label>Supporting Details:</label><br>
          <textarea class="detail-input" rows="3" style="width:90%;"></textarea>
        </div>
        <div class="body-section">
          <label>Topic Sentence:</label><br>
          <textarea class="topic-input" rows="2" style="width:90%;"></textarea><br>
          <label>Supporting Details:</label><br>
          <textarea class="detail-input" rows="3" style="width:90%;"></textarea>
        </div>
        <div class="body-section">
          <label>Topic Sentence:</label><br>
          <textarea class="topic-input" rows="2" style="width:90%;"></textarea><br>
          <label>Supporting Details:</label><br>
          <textarea class="detail-input" rows="3" style="width:90%;"></textarea>
        </div>
      </div>
      <button id="add-paragraph">Add Paragraph</button><br>
      <label>Conclusion:</label><br>
      <textarea id="draft-conclusion" rows="2" style="width:90%;" placeholder="Summarize your argument..."></textarea><br>
      <label>References:</label><br>
      <textarea id="draft-references" rows="3" style="width:90%;" placeholder="Enter references..."></textarea>
      <div>
        <button id="export-draft-docx">Export Draft (DOCX)</button>
        <button id="export-draft-pdf">Export Draft (PDF)</button>
      </div>
    </div>
  </div>
  <script src="outlining.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.5.0/docx.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../page-header.js"></script>
</body>
</html>
