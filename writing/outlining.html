<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Φ interactive</title>
  <link rel="stylesheet" href="../jeopardy/style.css">
  <link rel="icon" href="../favicon.png" type="image/png">
  <style>
    #puzzle-pieces li {
      display: inline-block;
      background: #ce93d8;
      color: #000;
      padding: 6px 8px;
      margin: 4px;
      border-radius: 6px;
      cursor: grab;
    }
    #outline-slots li {
      border: 2px dashed #7b1fa2;
      padding: 10px;
      margin: 8px 0;
      min-height: 40px;
      border-radius: 8px;
      list-style: none;
    }
    #outline-slots textarea {
      width: 90%;
      margin-top: 4px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #7b1fa2;
      border-radius: 4px;
    }
    #congrats {
      font-size: 24px;
      margin-top: 10px;
      color: #ffd54f;
    }
    .remove-btn {
      margin-left: 6px;
      background: #7b1fa2;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .citation {
      text-decoration: underline dotted;
      cursor: help;
    }
  </style>
</head>
<body>
  <nav id="top-nav">
    <a id="home-link" href="../index.html"><img id="site-icon" src="../icon.png" alt="Φ interactive icon"></a>
  </nav>
  <header id="page-header" data-default-course="writing">Course • Activity</header>
  <div class="container">
    <h1>Outline Builder</h1>
    <p class="instructions">Drag each piece into any order you wish. Use the blank lines to add your own explanation and support for each claim.</p>
    <ul id="puzzle-pieces"></ul>
    <button id="add-piece">Add Block</button>
    <ol id="outline-slots"></ol>
    <button id="example-btn">Show Example Outline</button>
    <div id="hint-text" class="hidden" hidden></div>
    <div id="congrats" class="hidden" hidden></div>
    <p id="summary" class="hidden" hidden><strong>Remember:</strong> Clear outlines guide readers step by step through your argument.</p>
    <button id="outline-btn">Open Outline Worksheet</button>
    <button id="open-draft-dev">Open Draft Development</button>
  </div>
  <script>
    window.activityOutcomes = [
      'Organize claims, evidence, and objections into a thesis-driven outline.',
      'Experiment with structure by dragging building blocks into argumentative order.',
      'Annotate sections with explanations and sources that preview body paragraphs.'
    ];
  </script>
  <script src="../utils.js"></script>
  <script src="outlining.js"></script>
  <script src="../explain.js"></script>
  <script src="../keyterms-sidebar.js"></script>
  <script src="../page-header.js"></script>
</body>
</html>
