<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Φ Gaming</title>
  <link rel="stylesheet" href="../jeopardy/style.css">
  <link rel="icon" href="../favicon.png" type="image/png">
  <style>
    #concept-pool li {
      display:inline-block;
      background:#ce93d8;
      color:#000;
      padding:6px 8px;
      margin:4px;
      border-radius:6px;
      cursor:grab;
      position:relative;
    }
    #concept-pool li button.delete {
      position:absolute;
      top:0;
      right:0;
      background:#777;
      border:none;
      color:#fff;
      border-radius:50%;
      width:16px;
      height:16px;
      font-size:12px;
      cursor:pointer;
    }
    #node-controls {
      margin-bottom:10px;
    }
    #node-controls input[type="text"] {
      padding:4px 6px;
      border-radius:4px;
      margin-right:6px;
    }
    .cluster {
      border:2px dashed #7b1fa2;
      padding:10px;
      margin:10px 0;
      min-height:60px;
      border-radius:8px;
      position:relative;
    }
    .cluster h3 {
      margin-top:0;
    }
    .cluster ul {
      list-style: none;
      padding: 0;
      min-height: 40px;  /* allow drop target when empty */
    }
    .cluster li {
      background:#ba68c8;
      color:#000;
      margin:4px;
      padding:4px 6px;
      border-radius:4px;
      cursor:grab;
      display:inline-block;
      position:relative;
    }
    .cluster li button.delete {
      position:absolute;
      top:0;
      right:0;
      background:#777;
      border:none;
      color:#fff;
      border-radius:50%;
      width:16px;
      height:16px;
      font-size:12px;
      cursor:pointer;
    }
    .cluster button.cluster-delete {
      position:absolute;
      top:0;
      right:0;
      background:#777;
      border:none;
      color:#fff;
      border-radius:50%;
      width:16px;
      height:16px;
      font-size:12px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <nav id="top-nav">
    <a id="home-link" href="../index.html"><img id="site-icon" src="../icon.png" alt="Gaming Philosophy Class icon"></a>
  </nav>
  <header id="page-header" data-default-course="writing">Course • Activity</header>
  <div class="container">
    <h1>Philosophical Mind Mapping</h1>
    <p class="instructions">Drag and drop the concepts below into logical clusters to brainstorm arguments against exceptionless moral rules.</p>
    <div id="node-controls">
      <input type="text" id="new-node-text" placeholder="Concept text">
      <input type="color" id="node-color" value="#ce93d8">
      <button id="add-node">Add Node</button>
    </div>
    <ul id="concept-pool"></ul>
    <div id="clusters">
      <div class="cluster drop-zone"><h3 contenteditable="true">Cluster 1</h3><ul></ul></div>
      <div class="cluster drop-zone"><h3 contenteditable="true">Cluster 2</h3><ul></ul></div>
      <div class="cluster drop-zone"><h3 contenteditable="true">Cluster 3</h3><ul></ul></div>
    </div>
    <button id="show-suggested">Show Suggested Clusters</button>
    <div id="suggested" class="hidden" hidden></div>
    <button id="add-cluster">Add Cluster</button>
    <button id="export-pdf">Export as PDF</button>
    <button id="clear-map">Clear Map</button>
  </div>
  <script src="brainstorm.js"></script>
  <script src="../vendor/html2canvas.min.js"></script>
  <script src="../vendor/jspdf.umd.min.js"></script>
  <script src="../page-header.js"></script>
</body>
</html>
