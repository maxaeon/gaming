<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thesis Evaluation</title>
  <link rel="stylesheet" href="../jeopardy/style.css">
  <link rel="icon" href="../favicon.png" type="image/png">
</head>
<body>
  <nav id="top-nav">
    <a id="home-link" href="../index.html">Thinker's Arcade</a>
  </nav>
  <div class="container">
    <h1>Thesis Evaluation</h1>
    <p class="instructions">Welcome to Thesis Evaluation! Submit a thesis critiquing Kant's insistence on exceptionless moral rules.</p>
    <textarea id="draft-input" rows="3" style="width:90%;"></textarea><br>
    <button id="draft-submit">Submit Draft</button>
    <button id="show-example">Show Example Thesis</button>
    <div id="feedback" class="hidden"></div>
    <div id="example" class="hidden"></div>
    <div id="revision-section" class="hidden">
      <h2>Revise Your Thesis</h2>
      <textarea id="revision-input" rows="3" style="width:90%;"></textarea><br>
      <button id="revise-submit">Submit Revision</button>
      <div id="revision-feedback" class="hidden"></div>
    </div>
    <section id="reflection" class="hidden">
      <h2>Reflective Prompts</h2>
      <p>How did the feedback change your approach? What remains unclear in your argument?</p>
    </section>
    <button id="start-project">Start Your Own Project</button>
    <div id="project-area" class="project-area hidden">
      <h2>Thesis Workspace</h2>
      <textarea id="project-thesis" rows="4" style="width:90%;"></textarea><br>
      <button id="export-thesis">Export as DOCX</button>
      <button id="reset-thesis">Reset</button>
    </div>
  </div>
  <script src="thesis-evaluation.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.5.0/docx.umd.min.js"></script>
</body>
</html>
