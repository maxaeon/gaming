<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Φ Gaming</title>
  <link rel="stylesheet" href="../jeopardy/style.css">
  <link rel="icon" href="../favicon.png" type="image/png">
  <style>
    #scenario-text {
      font-size: 20px;
      margin-bottom: 20px;
    }
    #result p {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <nav id="top-nav">
    <a id="home-link" href="../index.html">Gaming Philosophy Class</a>
  </nav>
  <header id="page-header" data-default-course="ethics">Course • Activity</header>
  <div class="container">
    <h1>Trolley Problem Simulator</h1>
    <div id="scenario">
      <p id="scenario-text"></p>
      <div class="game-links" id="choices">
        <button id="action-btn">Pull the Lever</button>
        <button id="inaction-btn">Do Nothing</button>
      </div>
    </div>
    <div id="result" class="hidden" hidden>
      <p id="result-text"></p>
      <p id="reflection-question"></p>
      <button id="next-btn">Next Scenario</button>
    </div>
    <div id="summary" class="hidden" hidden></div>
  </div>
  <script src="trolley.js"></script>
  <script src="../next-activity.js"></script>
  <script src="../page-header.js"></script>
</body>
</html>
